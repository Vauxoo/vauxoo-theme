<text x="258" y="210" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 1</tspan></text><text x="300" y="210" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fill="#7A8288" font-style="italic"># Vauxoo Dark — official brand palette</tspan></text><text x="258" y="236" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 2</tspan></text><text x="300" y="236" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fill="#E11E4D" font-style="normal">from </tspan><tspan fill="#D6DAE0" font-style="normal">odoo </tspan><tspan fill="#E11E4D" font-style="normal">import </tspan><tspan fill="#D6DAE0" font-style="normal">api, fields, models</tspan></text><text x="258" y="262" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 3</tspan></text><text x="258" y="288" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 4</tspan></text><text x="300" y="288" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fill="#E11E4D" font-style="normal">class </tspan><tspan fill="#E4A900" font-style="normal">SaleOrder</tspan><tspan fill="#D6DAE0" font-style="normal">(models.</tspan><tspan fill="#E4A900" font-style="normal">Model</tspan><tspan fill="#D6DAE0" font-style="normal">):</tspan></text><text x="258" y="314" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 5</tspan></text><text x="300" y="314" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fi