l="#DFE2E6" font-style="normal">    _inherit </tspan><tspan fill="#DFE2E6" font-style="normal">= </tspan><tspan fill="#82BCCE" font-style="normal">"sale.order"</tspan></text><text x="258" y="340" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 6</tspan></text><text x="258" y="366" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 7</tspan></text><text x="300" y="366" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fill="#DFE2E6" font-style="normal">    vauxoo_score </tspan><tspan fill="#DFE2E6" font-style="normal">= fields.</tspan><tspan fill="#E0507A" font-style="normal">Float</tspan><tspan fill="#DFE2E6" font-style="normal">(default=</tspan><tspan fill="#8A6BB5" font-style="normal">100.0</tspan><tspan fill="#DFE2E6" font-style="normal">)</tspan></text><text x="258" y="392" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 8</tspan></text><text x="258" y="418" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#5C6166" font-style="normal"> 9</tspan></text><text x="300" y="418" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal" xml:space="preserve"><tspan fill="#5498CC" font-style="normal">    @api.depends</tspan><tspan fill="#DFE2E6" font-style="normal">(</tspan><tspan fill="#82BCCE" font-style="normal">"order_line.price_total"</tspan><tspan fill="#DFE2E6" font-style="normal">)</tspan></text><text x="258" y="444" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="normal" xml:space="preserve"><tspan fill="#E9BE44" font-style="normal">10</tspan></text><text x="300" y="444" font-family="SF Mono, Menlo, monospace" font-size="15" font-weight="normal